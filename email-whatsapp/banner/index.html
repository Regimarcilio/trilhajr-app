<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailChat — Cliente de E-mail Estilo WhatsApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 600px;
            width: 90%;
            text-align: center;
            overflow: hidden;
        }
        .ex-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b6b, #ee5a5a);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }
        .brand-name {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        .brand-tagline {
            color: #666;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        .features-list {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0;
        }
        .features-list li {
            display: flex;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .features-list li:last-child { border-bottom: none; }
        .feature-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        .feature-icon::after {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 4px;
        }
        .cta-button {
            display: inline-block;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        .footer-note {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.85rem;
        }
        @media (max-width: 480px) {
            .brand-name { font-size: 2rem; }
            .banner { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="ex-badge">EX TECHNOLOGIES</div>
        <h1 class="brand-name">MailChat</h1>
        <p class="brand-tagline">Sua caixa de e-mail reorganizada como conversas do WhatsApp</p>
        
        <ul class="features-list">
            <li><span class="feature-icon"></span> Interface intuitiva inspirada no WhatsApp</li>
            <li><span class="feature-icon"></span> Sincronização em tempo real com Gmail</li>
            <li><span class="feature-icon"></span> Organização em conversas e post-its</li>
            <li><span class="feature-icon"></span> Compatível com dispositivos móveis</li>
        </ul>
        
        <button class="cta-button" onclick="window.location.href='/'">Começar agora</button>
        
        <div class="footer-note">
            Desenvolvido por <strong>EX Technologies</strong> &copy; 2026
        </div>
    </div>
</body>
</html>
