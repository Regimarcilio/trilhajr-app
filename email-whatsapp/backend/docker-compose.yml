# Postgres local do MailChat (F0).
# Auth "trust" e bind em 127.0.0.1: uso exclusivo de desenvolvimento — nunca reutilize em produção.
services:
  postgres:
    image: postgres:18-alpine
    container_name: mailchat-postgres
    environment:
      POSTGRES_USER: mailchat
      POSTGRES_DB: mailchat
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      # Postgres 18+ usa /var/lib/postgresql (PGDATA em subdiretório versionado).
      - mailchat-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailchat -d mailchat']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mailchat-postgres-data:
